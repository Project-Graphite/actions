name: VPS SSH
description: Connects ssh and scp to the Project Graphite VPS through Cloudflare Access as the host "graphite".

inputs:
  host:
    description: SSH hostname behind Cloudflare Access
    required: true
  key:
    description: Private key of the deploy user
    required: true
  known-hosts:
    description: known_hosts line for the host
    required: true
  access-id:
    description: Cloudflare Access service token ID
    required: true
  access-secret:
    description: Cloudflare Access service token secret
    required: true

runs:
  using: composite
  steps:
    - name: Install cloudflared
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/cloudflared" \
          https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64
        sudo install "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared

    - name: Configure SSH
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        KEY: ${{ inputs.key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
        ACCESS_ID: ${{ inputs.access-id }}
        ACCESS_SECRET: ${{ inputs.access-secret }}
      run: |
        set -euo pipefail
        install -d -m 700 ~/.ssh
        printf '%s\n' "$KEY" > ~/.ssh/graphite
        chmod 600 ~/.ssh/graphite
        printf '%s\n' "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
        {
          echo "TUNNEL_SERVICE_TOKEN_ID=$ACCESS_ID"
          echo "TUNNEL_SERVICE_TOKEN_SECRET=$ACCESS_SECRET"
        } >> "$GITHUB_ENV"
        cat >> ~/.ssh/config <<CONFIG
        Host graphite
          HostName $HOST
          User deploy
          IdentityFile ~/.ssh/graphite
          IdentitiesOnly yes
          ServerAliveInterval 30
          ProxyCommand cloudflared access ssh --hostname %h --service-token-id \$TUNNEL_SERVICE_TOKEN_ID --service-token-secret \$TUNNEL_SERVICE_TOKEN_SECRET
        CONFIG
