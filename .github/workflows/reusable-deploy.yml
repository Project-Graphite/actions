name: Deploy

on:
  workflow_call:
    inputs:
      services:
        type: string
        required: true
      tag:
        type: string
        default: ""
    secrets:
      PLATFORM_APP_CLIENT_ID:
        required: false
      PLATFORM_APP_PRIVATE_KEY:
        required: false

jobs:
  deploy:
    name: Deploy
    if: ${{ inputs.services != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/platform
          token: ${{ steps.app-token.outputs.token }}

      - name: Read registry entry
        id: entry
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          SLUG="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          export SLUG

          if [ ! -f "projects/${SLUG}.yml" ]; then
            echo "::error::No registry entry at projects/${SLUG}.yml in the platform repository."
            echo "Add an entry with slug ${SLUG} to this repository's .graphite.yml before it can deploy."
            exit 1
          fi

          kind="$(python3 -c "import os,yaml;print(yaml.safe_load(open(f\"projects/{os.environ['SLUG']}.yml\"))['deploy']['kind'])")"
          if [ "$kind" != "compose" ] && [ "$kind" != "pages" ]; then
            echo "Registry entry declares kind: ${kind}, which has nothing to deploy."
          fi

          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"

      - name: Record the image tag
        if: ${{ steps.entry.outputs.kind == 'compose' || steps.entry.outputs.kind == 'pages' }}
        env:
          TAG: ${{ inputs.tag }}
          SLUG: ${{ steps.entry.outputs.slug }}
        run: |
          set -euo pipefail
          export TAG="${TAG:-sha-${GITHUB_SHA::7}}"

          if [ ! -d "deploy/${SLUG}" ]; then
            echo "No deploy/${SLUG}/ in the platform repository, so ${SLUG} is not deployed; nothing to record."
            exit 0
          fi

          python3 - <<'PY'
          import os, pathlib

          path = pathlib.Path("deploy") / os.environ["SLUG"] / "values"
          lines = [line for line in (path.read_text().splitlines() if path.exists() else []) if not line.startswith("IMAGE_TAG=")]
          path.write_text("\n".join([f"IMAGE_TAG={os.environ['TAG']}", *lines]) + "\n")
          PY

          git config user.name "graphite-deploy"
          git config user.email "deploy@project-graphite.com"
          git add "deploy/${SLUG}/values"

          if git diff --cached --quiet; then
            echo "IMAGE_TAG is already ${TAG}; nothing to record."
            exit 0
          fi

          git commit --message "chore(${SLUG}): deploy ${TAG}"

          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then
              echo "Recorded ${TAG} for ${SLUG}."
              exit 0
            fi
            echo "Push raced with another deploy; retrying (${attempt}/3)."
            sleep $(( attempt * 5 ))
          done

          echo "::error::Could not push the tag update after 3 attempts."
          exit 1
