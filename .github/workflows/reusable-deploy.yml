name: Deploy

on:
  workflow_call:
    inputs:
      services:
        type: string
        required: true
      tag:
        type: string
        default: ""
    secrets:
      PLATFORM_APP_CLIENT_ID:
        required: false
      PLATFORM_APP_PRIVATE_KEY:
        required: false
      COOLIFY_WEBHOOK:
        required: false
      COOLIFY_TOKEN:
        required: false

jobs:
  deploy:
    name: Deploy
    if: ${{ inputs.services != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/platform
          token: ${{ steps.app-token.outputs.token }}

      - name: Read registry entry
        id: entry
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          SLUG="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          export SLUG

          if [ ! -f "projects/${SLUG}.yml" ]; then
            echo "::error::No registry entry at projects/${SLUG}.yml in the platform repository."
            echo "Add an entry with slug ${SLUG} to this repository's .graphite.yml before it can deploy."
            exit 1
          fi

          kind="$(python3 -c "import os,yaml;print(yaml.safe_load(open(f\"projects/{os.environ['SLUG']}.yml\"))['deploy']['kind'])")"
          if [ "$kind" != "compose" ] && [ "$kind" != "pages" ]; then
            echo "Registry entry declares kind: ${kind}, which has nothing to deploy."
          fi

          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"

      - name: Trigger Coolify deployment
        if: ${{ steps.entry.outputs.kind == 'compose' }}
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::notice::COOLIFY_WEBHOOK is not set in this repository; recording the tag without deploying."
            exit 0
          fi

          curl --fail --show-error --silent --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Record tags
        if: ${{ steps.entry.outputs.kind == 'compose' || steps.entry.outputs.kind == 'pages' }}
        env:
          SERVICES: ${{ inputs.services }}
          TAG: ${{ inputs.tag }}
          SLUG: ${{ steps.entry.outputs.slug }}
        run: |
          set -euo pipefail
          export TAG="${TAG:-sha-${GITHUB_SHA::7}}"

          python3 - <<'PY'
          import json, os, pathlib

          path = pathlib.Path("tags") / f"{os.environ['SLUG']}.json"
          path.parent.mkdir(exist_ok=True)
          tags = json.loads(path.read_text()) if path.exists() else {}
          tags.update(dict.fromkeys(json.loads(os.environ["SERVICES"]), os.environ["TAG"]))
          path.write_text(json.dumps(tags, indent=2, sort_keys=True) + "\n")
          PY

          git config user.name "graphite-deploy"
          git config user.email "deploy@project-graphite.com"
          git add "tags/${SLUG}.json"

          if git diff --cached --quiet; then
            echo "Tags already at ${TAG}; nothing to record."
            exit 0
          fi

          git commit --message "chore(${SLUG}): deploy ${TAG}"

          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then
              echo "Recorded ${TAG} for ${SLUG}."
              exit 0
            fi
            echo "Push raced with another deploy; retrying (${attempt}/3)."
            sleep $(( attempt * 5 ))
          done

          echo "::error::Could not push the tag update after 3 attempts."
          exit 1
