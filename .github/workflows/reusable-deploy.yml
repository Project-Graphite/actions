name: Deploy

on:
  workflow_call:
    inputs:
      services:
        type: string
        required: true
      tag:
        type: string
        required: true
    secrets:
      PLATFORM_APP_ID:
        required: false
      PLATFORM_APP_PRIVATE_KEY:
        required: false

jobs:
  record:
    name: Record
    if: ${{ inputs.services != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the deploy app
        env:
          APP_ID: ${{ secrets.PLATFORM_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ]; then
            echo "::error::PLATFORM_APP_ID and PLATFORM_APP_PRIVATE_KEY are not set for this organisation."
            echo "Create the Graphite Deploy GitHub App, install it on the platform repository,"
            echo "and add both as organisation secrets. Images were built and pushed; only the"
            echo "record step is blocked."
            exit 1
          fi

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.PLATFORM_APP_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/platform
          token: ${{ steps.app-token.outputs.token }}

      - name: Record image tags
        env:
          SERVICES: ${{ inputs.services }}
          TAG: ${{ inputs.tag }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          SLUG="$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')"
          export SLUG

          if [ ! -f "projects/${SLUG}.yml" ]; then
            echo "::error::No registry entry at projects/${SLUG}.yml in the platform repository."
            echo "Open a pull request adding it before this repository can deploy."
            exit 1
          fi

          kind="$(python3 -c "import os,yaml;print(yaml.safe_load(open(f\"projects/{os.environ['SLUG']}.yml\"))['deploy']['kind'])")"
          if [ "$kind" != "compose" ]; then
            echo "Registry entry declares kind: ${kind}, which does not run container images."
            echo "Nothing to record."
            exit 0
          fi

          python3 - <<'PY'
          import json, os, pathlib

          path = pathlib.Path("tags") / f"{os.environ['SLUG']}.json"
          path.parent.mkdir(exist_ok=True)
          tags = json.loads(path.read_text()) if path.exists() else {}
          tags.update(dict.fromkeys(json.loads(os.environ["SERVICES"]), os.environ["TAG"]))
          path.write_text(json.dumps(tags, indent=2, sort_keys=True) + "\n")
          PY

          git config user.name "graphite-deploy"
          git config user.email "deploy@project-graphite.com"
          git add "tags/${SLUG}.json"

          if git diff --cached --quiet; then
            echo "Tags already at ${TAG}; nothing to record."
            exit 0
          fi

          git commit --message "chore(${SLUG}): deploy ${TAG}"

          for attempt in 1 2 3; do
            if git pull --rebase --quiet origin main && git push origin HEAD:main; then
              echo "Recorded ${TAG} for ${SLUG}."
              exit 0
            fi
            echo "Push raced with another deploy; retrying (${attempt}/3)."
            sleep $(( attempt * 5 ))
          done

          echo "::error::Could not push the tag update after 3 attempts."
          exit 1
