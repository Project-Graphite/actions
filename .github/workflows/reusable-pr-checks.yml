name: PR Checks

on:
  workflow_call:
    inputs:
      xs-max:
        type: number
        default: 10
      s-max:
        type: number
        default: 50
      m-max:
        type: number
        default: 200
      l-max:
        type: number
        default: 600

jobs:
  size:
    name: Size
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          XS_MAX: ${{ inputs.xs-max }}
          S_MAX: ${{ inputs.s-max }}
          M_MAX: ${{ inputs.m-max }}
          L_MAX: ${{ inputs.l-max }}
        run: |
          set -euo pipefail

          lockfiles='(package-lock[.]json|pnpm-lock[.]yaml|yarn[.]lock|poetry[.]lock|uv[.]lock|Cargo[.]lock|go[.]sum)$'
          changed="$(gh api "repos/${GH_REPO}/pulls/${PR}/files" --paginate \
            --jq ".[] | select(.filename | test(\"${lockfiles}\") | not) | .additions + .deletions" \
            | awk '{ total += $1 } END { print total + 0 }')"

          if   [ "$changed" -le "$XS_MAX" ]; then bucket=xs; color=0E8A16; range="0-${XS_MAX}"
          elif [ "$changed" -le "$S_MAX"  ]; then bucket=s;  color=0E8A16; range="$((XS_MAX + 1))-${S_MAX}"
          elif [ "$changed" -le "$M_MAX"  ]; then bucket=m;  color=FBCA04; range="$((S_MAX + 1))-${M_MAX}"
          elif [ "$changed" -le "$L_MAX"  ]; then bucket=l;  color=D93F0B; range="$((M_MAX + 1))-${L_MAX}"
          else                                    bucket=xl; color=B60205; range="Over ${L_MAX}"
          fi

          echo "${changed} changed lines excluding lockfiles -> size/${bucket}"

          gh label create "size/${bucket}" --color "$color" --description "${range} changed lines, excluding lockfiles" --force

          applied="$(gh pr view "$PR" --json labels --jq '.labels[].name | select(startswith("size/"))')"
          for label in $applied; do
            [ "$label" = "size/${bucket}" ] || gh pr edit "$PR" --remove-label "$label"
          done
          gh pr edit "$PR" --add-label "size/${bucket}"

  paths:
    name: Paths
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/labeler@v7
        if: hashFiles('.github/labeler.yml') != ''
