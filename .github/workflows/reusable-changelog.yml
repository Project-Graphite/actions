name: Changelog

on:
  workflow_call:
    secrets:
      PLATFORM_APP_CLIENT_ID:
        required: false
      PLATFORM_APP_PRIVATE_KEY:
        required: false

jobs:
  record:
    name: Record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: graphite-hub,platform,${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/graphite-hub
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
        working-directory: site

      - name: List the tags before
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api "repos/${REPOSITORY}/tags" --paginate --jq '.[].name' | sort > "${RUNNER_TEMP}/tags-before"

      - name: Tag the next version
        working-directory: site
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: npm run sync:releases -- --cut "--repo=${REPOSITORY}"

      - name: Publish a GitHub release for each new tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/tags" --paginate --jq '.[].name' | sort > "${RUNNER_TEMP}/tags-after"
          comm -13 "${RUNNER_TEMP}/tags-before" "${RUNNER_TEMP}/tags-after" | while read -r tag; do
            gh release create "$tag" --repo "$REPOSITORY" --verify-tag --generate-notes --title "$tag"
            echo "Published the ${tag} release."
          done
