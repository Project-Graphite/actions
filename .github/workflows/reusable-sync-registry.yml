name: Sync registry

on:
  workflow_call:

jobs:
  dispatch:
    name: Request registry sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/create-github-app-token@v3
        id: read-token
        with:
          client-id: ${{ secrets.PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/platform
          token: ${{ steps.read-token.outputs.token }}
          path: .platform
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: pip install pyyaml jsonschema

      - name: Validate .graphite.yml
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
        run: python .platform/scripts/sync.py "${{ github.event.repository.name }}" .graphite.yml

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform
          permission-contents: write

      - name: Dispatch to the registry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/${{ github.repository_owner }}/platform/dispatches" \
            --field event_type=sync-registry
