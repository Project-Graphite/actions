name: Checks

on:
  workflow_call:
    inputs:
      services:
        type: string
        required: true
      node-version:
        type: string
        default: "24"
      python-version:
        type: string
        default: "3.14"

jobs:
  checks:
    name: ${{ matrix.service }}
    if: ${{ inputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - id: toolchain
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "kind=node" >> "$GITHUB_OUTPUT"
          elif [ -f Makefile ]; then
            echo "kind=make" >> "$GITHUB_OUTPUT"
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.service }} has no package.json or Makefile; the image build is its only gate."
          fi

      - uses: actions/setup-node@v7
        if: steps.toolchain.outputs.kind == 'node'
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - if: steps.toolchain.outputs.kind == 'node'
        run: npm ci

      - name: Lint
        if: steps.toolchain.outputs.kind == 'node'
        run: npm run lint --if-present

      - name: Test
        if: steps.toolchain.outputs.kind == 'node'
        run: npm run test --if-present

      - name: Build
        if: steps.toolchain.outputs.kind == 'node'
        run: npm run build --if-present

      - uses: actions/setup-python@v7
        if: steps.toolchain.outputs.kind == 'make'
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install
        if: steps.toolchain.outputs.kind == 'make'
        run: make install

      - name: Lint
        if: steps.toolchain.outputs.kind == 'make'
        run: make lint

      - name: Test
        if: steps.toolchain.outputs.kind == 'make'
        run: make test
