name: Docker Build and Push

on:
  workflow_call:
    inputs:
      services:
        type: string
        required: true
      push:
        type: boolean
        default: true
    outputs:
      tag:
        value: ${{ jobs.meta.outputs.tag }}

jobs:
  meta:
    name: Tag
    if: ${{ inputs.services != '[]' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
      image: ${{ steps.compute.outputs.image }}
    steps:
      - id: compute
        run: |
          set -euo pipefail
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.service }}
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(inputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ inputs.push }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: ${{ inputs.push }}
          provenance: false
          tags: |
            ${{ needs.meta.outputs.image }}/${{ matrix.service }}:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.image }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
